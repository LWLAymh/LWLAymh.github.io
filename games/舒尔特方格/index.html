<script>
(function () {
  'use strict';

  var rowsEl = document.getElementById('rows');
  var colsEl = document.getElementById('cols');
  var startEl = document.getElementById('start');
  var boardEl = document.getElementById('board');
  var nextEl = document.getElementById('next');
  var timeEl = document.getElementById('time');
  var wrongEl = document.getElementById('wrong');
  var bestEl = document.getElementById('best');

  // 颜色少一点，重点放在“找数字”本身
  var COLORS = ['#4a7db5', '#5d79b8', '#2aa9a0', '#8a6d8a'];
  var rows, cols, order, next, wrongCount, startTs, timerId, started, done;

  function safeGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function safeSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  function sizeKey() { return 'schulte-best-' + rows + 'x' + cols; }

  function newGame() {
    rows = Math.min(12, Math.max(1, parseInt(rowsEl.value, 10) || 5));
    cols = Math.min(12, Math.max(1, parseInt(colsEl.value, 10) || 5));
    rowsEl.value = rows; colsEl.value = cols;
    var total = rows * cols;
    order = [];
    for (var i = 1; i <= total; i++) order.push(i);
    for (var k = order.length - 1; k > 0; k--) {
      var j = Math.floor(Math.random() * (k + 1));
      var t = order[k]; order[k] = order[j]; order[j] = t;
    }
    next = 1;
    wrongCount = 0;
    done = false;
    started = false;
    clearInterval(timerId);
    nextEl.textContent = next;
    wrongEl.textContent = 0;
    timeEl.textContent = '0.0';
    bestEl.textContent = safeGet(sizeKey()) || '—';
    render();
  }

  function render() {
    boardEl.style.gridTemplateColumns = 'repeat(' + cols + ', 54px)';
    boardEl.innerHTML = '';
    for (var i = 0; i < order.length; i++) {
      var cell = document.createElement('div');
      cell.className = 'cell';
      cell.setAttribute('data-n', order[i]);
      var span = document.createElement('span');
      span.textContent = order[i];
      span.style.color = COLORS[Math.floor(Math.random() * COLORS.length)];
      span.style.fontSize = (16 + Math.floor(Math.random() * 18)) + 'px';
      span.style.transform = 'rotate(' + (Math.floor(Math.random() * 61) - 30) + 'deg)';
      cell.appendChild(span);
      cell.addEventListener('click', function () { clickCell(this); });
      boardEl.appendChild(cell);
    }
  }

  function elapsed() { return ((Date.now() - startTs) / 1000).toFixed(1); }

  function tick() { timeEl.textContent = elapsed(); }

  function clickCell(cell) {
    if (done) return;
    var n = Number(cell.getAttribute('data-n'));
    if (!started) { started = true; startTs = Date.now(); timerId = setInterval(tick, 100); }
    if (n === next) {
      cell.classList.add('done');
      next++;
      nextEl.textContent = next;
      if (next > rows * cols) {
        done = true;
        clearInterval(timerId);
        timeEl.textContent = elapsed();
        var old = safeGet(sizeKey());
        if (!old || parseFloat(old) > parseFloat(timeEl.textContent)) {
          safeSet(sizeKey(), timeEl.textContent);
          bestEl.textContent = timeEl.textContent + '（新纪录）';
        } else {
          bestEl.textContent = old;
        }
      }
    } else {
      wrongCount++;
      wrongEl.textContent = wrongCount;
      cell.classList.add('wrong');
      setTimeout(function () { cell.classList.remove('wrong'); }, 260);
    }
  }

  startEl.addEventListener('click', newGame);
  newGame();
})();
</script>
