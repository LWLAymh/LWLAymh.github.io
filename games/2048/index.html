<script>
(function () {
  'use strict';

  var board = [];
  var score = 0;
  var over = false;
  var won = false;
  var boardEl = document.getElementById('board');
  var tilesEl = document.getElementById('tiles');
  var overlay = document.getElementById('overlay');
  var overlayText = document.getElementById('overlay-text');
  var scoreEl = document.getElementById('score');
  var bestEl = document.getElementById('best');

  function safeGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function safeSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  var best = parseInt(safeGet('2048-best') || '0', 10) || 0;
  bestEl.textContent = best;

  function empty() { return new Array(16).fill(0); }
  function zeros() { return board.reduce(function (n, v) { return n + (v === 0 ? 1 : 0); }, 0); }

  function addTile() {
    var n = zeros();
    if (!n) return;
    var at = Math.floor(Math.random() * n);
    var val = Math.random() < 0.9 ? 2 : 4;
    for (var i = 0; i < 16; i++) {
      if (board[i] === 0) {
        if (at === 0) {
          board[i] = val;
          markNew(i);
          return;
        }
        at--;
      }
    }
  }

  var newTiles = new Set();
  function markNew(i) { newTiles.add(i); }
  function render() {
    tilesEl.innerHTML = '';
    for (var i = 0; i < 16; i++) {
      var el = document.createElement('div');
      if (!board[i]) {
        el.className = 'cell';
      } else {
        el.className = 'tile' + (newTiles.has(i) ? ' new' : '');
        el.setAttribute('data-v', board[i]);
        el.style.fontSize = board[i] >= 1024 ? '1.3rem' : board[i] >= 128 ? '1.5rem' : '2rem';
        el.textContent = board[i];
      }
      tilesEl.appendChild(el);
    }
    newTiles.clear();
    scoreEl.textContent = score;
    if (score > best) { best = score; safeSet('2048-best', String(best)); bestEl.textContent = best; }
  }

  function reset() {
    board = empty();
    score = 0;
    over = false;
    won = false;
    overlay.hidden = true;
    addTile();
    addTile();
    render();
  }

  function slide(row) {
    var arr = row.filter(function (v) { return v !== 0; });
    var out = [];
    for (var i = 0; i < arr.length; i++) {
      if (i + 1 < arr.length && arr[i] === arr[i + 1]) {
        var merged = arr[i] * 2;
        out.push(merged);
        score += merged;
        if (merged === 2048) won = true;
        i++;
      } else {
        out.push(arr[i]);
      }
    }
    while (out.length < 4) out.push(0);
    return out;
  }

  function getRow(r) { return board.slice(r * 4, r * 4 + 4); }
  function setRow(r, row) { for (var i = 0; i < 4; i++) board[r * 4 + i] = row[i]; }
  function getCol(c) { var a = []; for (var r = 0; r < 4; r++) a.push(board[r * 4 + c]); return a; }
  function setCol(c, col) { for (var r = 0; r < 4; r++) board[r * 4 + c] = col[r]; }

  function same(a, b) {
    for (var i = 0; i < a.length; i++) if (a[i] !== b[i]) return false;
    return true;
  }

  function move(dir) {
    if (over) return;
    var before = board.slice();
    if (dir === 'left' || dir === 'right') {
      for (var r = 0; r < 4; r++) {
        var row = getRow(r);
        if (dir === 'right') row = row.slice().reverse();
        row = slide(row);
        if (dir === 'right') row = row.reverse();
        setRow(r, row);
      }
    } else {
      for (var c = 0; c < 4; c++) {
        var col = getCol(c);
        if (dir === 'down') col = col.slice().reverse();
        col = slide(col);
        if (dir === 'down') col = col.reverse();
        setCol(c, col);
      }
    }

    if (!same(before, board)) {
      addTile();
      render();
      checkEnd();
    }
  }

  function canMove() {
    if (zeros()) return true;
    for (var r = 0; r < 4; r++) {
      for (var c = 0; c < 4; c++) {
        var v = board[r * 4 + c];
        if (c < 3 && board[r * 4 + c + 1] === v) return true;
        if (r < 3 && board[(r + 1) * 4 + c] === v) return true;
      }
    }
    return false;
  }

  function checkEnd() {
    if (won) {
      over = true;
      overlayText.textContent = '🎉 你赢了！得分 ' + score + '，再来一局挑战更高分。';
      overlay.hidden = false;
      return;
    }
    if (!canMove()) {
      over = true;
      overlayText.textContent = '游戏结束，得分 ' + score;
      overlay.hidden = false;
    }
  }

  document.getElementById('new-btn').addEventListener('click', reset);
  document.getElementById('restart-btn').addEventListener('click', function () { overlay.hidden = true; reset(); });

  document.addEventListener('keydown', function (e) {
    var k = e.key;
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].indexOf(k) >= 0) e.preventDefault();
    if (k === 'ArrowUp' || k === 'w' || k === 'W') move('up');
    else if (k === 'ArrowDown' || k === 's' || k === 'S') move('down');
    else if (k === 'ArrowLeft' || k === 'a' || k === 'A') move('left');
    else if (k === 'ArrowRight' || k === 'd' || k === 'D') move('right');
  });

  var touch = null;
  boardEl.addEventListener('touchstart', function (e) { touch = e.touches[0]; }, { passive: true });
  boardEl.addEventListener('touchend', function (e) {
    if (!touch) return;
    var t = e.changedTouches[0];
    var dx = t.clientX - touch.clientX, dy = t.clientY - touch.clientY;
    if (Math.max(Math.abs(dx), Math.abs(dy)) > 24) {
      move(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
    }
    touch = null;
  });

  reset();
})();
</script>
