<script>
(function () {
  'use strict';

  var N = 20;
  var CELL = 20;
  var canvas = document.getElementById('board');
  var ctx = canvas.getContext('2d');
  var scoreEl = document.getElementById('score');
  var bestEl = document.getElementById('best');
  var overlay = document.getElementById('overlay');
  var overlayText = document.getElementById('overlay-text');
  var startBtn = document.getElementById('start-btn');

  function safeGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function safeSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  var best = parseInt(safeGet('snake-best') || '0', 10) || 0;
  bestEl.textContent = best;

  var snake, dir, nextDir, food, score, running, timer, over = false;

  function reset() {
    snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
    dir = { x: 1, y: 0 };
    nextDir = dir;
    score = 0;
    scoreEl.textContent = score;
    spawnFood();
  }

  function spawnFood() {
    do {
      food = { x: Math.floor(Math.random() * N), y: Math.floor(Math.random() * N) };
    } while (snake.some(function (p) { return p.x === food.x && p.y === food.y; }));
  }

  function setDir(d) {
    if (!d) return;
    if ((d.x !== 0 && dir.x !== 0) || (d.y !== 0 && dir.y !== 0)) return;
    if (d.x === -dir.x && d.y === -dir.y) return;
    nextDir = d;
  }

  function step() {
    dir = nextDir;
    var head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    if (head.x < 0 || head.y < 0 || head.x >= N || head.y >= N ||
        snake.some(function (p) { return p.x === head.x && p.y === head.y; })) {
      gameOver();
      return;
    }
    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
      score += 1;
      scoreEl.textContent = score;
      if (score > best) {
        best = score;
        safeSet('snake-best', String(best));
        bestEl.textContent = best;
      }
      spawnFood();
    } else {
      snake.pop();
    }
    draw();
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = 'rgba(255,255,255,.025)';
    for (var i = 1; i < N; i++) {
      ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, canvas.height); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i * CELL); ctx.lineTo(canvas.width, i * CELL); ctx.stroke();
    }
    snake.forEach(function (p, i) {
      var alpha = i === 0 ? 1 : 0.55 + 0.45 * (1 - i / snake.length);
      ctx.fillStyle = i === 0 ? '#86aedb' : 'rgba(74,125,181,' + alpha.toFixed(2) + ')';
      var r = 4;
      ctx.beginPath();
      if (ctx.roundRect) {
        ctx.roundRect(p.x * CELL + 2, p.y * CELL + 2, CELL - 4, CELL - 4, r);
      } else {
        ctx.rect(p.x * CELL + 2, p.y * CELL + 2, CELL - 4, CELL - 4);
      }
      ctx.fill();
    });
    ctx.fillStyle = '#f08a8a';
    ctx.beginPath();
    ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, 6, 0, Math.PI * 2);
    ctx.fill();
  }

  function gameOver() {
    stopLoop();
    running = false;
    over = true;
    overlayText.textContent = '游戏结束，得分 ' + score;
    startBtn.textContent = '再来一局';
    overlay.hidden = false;
  }

  function start() {
    reset();
    running = true;
    over = false;
    overlay.hidden = true;
    startLoop();
  }

  function startLoop() {
    stopLoop();
    timer = setInterval(step, 130);
  }
  function stopLoop() {
    if (timer) { clearInterval(timer); timer = null; }
  }

  startBtn.addEventListener('click', start);

  document.querySelectorAll('.controls button').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var d = btn.getAttribute('data-dir');
      setDir(d === 'up' ? { x: 0, y: -1 } : d === 'down' ? { x: 0, y: 1 } :
            d === 'left' ? { x: -1, y: 0 } : { x: 1, y: 0 });
    });
  });

  document.addEventListener('keydown', function (e) {
    var d;
    if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') d = { x: 0, y: -1 };
    else if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') d = { x: 0, y: 1 };
    else if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') d = { x: -1, y: 0 };
    else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') d = { x: 1, y: 0 };
    else if (e.key === ' ') {
      e.preventDefault();
      if (running) {
        running = false;
        stopLoop();
        overlayText.textContent = '已暂停';
        startBtn.textContent = '继续';
        overlay.hidden = false;
      } else if (!over) {
        start();
      }
      return;
    }
    if (d) {
      e.preventDefault();
      if (!running && !overlay.hidden) return;
      setDir(d);
    }
  });

  var touch = null;
  canvas.addEventListener('touchstart', function (e) { touch = e.touches[0]; }, { passive: true });
  canvas.addEventListener('touchend', function (e) {
    if (!touch) return;
    var t = e.changedTouches[0];
    var dx = t.clientX - touch.clientX, dy = t.clientY - touch.clientY;
    if (Math.max(Math.abs(dx), Math.abs(dy)) > 24) {
      setDir(Math.abs(dx) > Math.abs(dy) ? { x: dx > 0 ? 1 : -1, y: 0 } : { x: 0, y: dy > 0 ? 1 : -1 });
    }
    touch = null;
  });

  reset();
  draw();
})();
</script>
