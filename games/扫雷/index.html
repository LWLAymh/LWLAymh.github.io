<script>
(function () {
  'use strict';

  var boardEl = document.getElementById('board');
  var levelEl = document.getElementById('level');
  var restartEl = document.getElementById('restart');
  var minesEl = document.getElementById('mines');
  var timerEl = document.getElementById('timer');
  var statusEl = document.getElementById('status');

  var rows, cols, mineCount, cells, revealed, flags, started, over, timerId, seconds;

  function parseLevel() {
    var parts = levelEl.value.split(',').map(Number);
    return { rows: parts[0], cols: parts[0], mines: parts[1] };
  }

  function newGame() {
    var lv = parseLevel();
    rows = lv.rows; cols = lv.cols; mineCount = lv.mines;
    cells = [];
    revealed = 0; flags = 0; over = false; started = false; seconds = 0;
    clearInterval(timerId);
    timerEl.textContent = 0;
    minesEl.textContent = mineCount;
    statusEl.textContent = '点击格子开始';
    for (var i = 0; i < rows * cols; i++) {
      cells.push({ mine: false, adj: 0, open: false, flag: false });
    }
    render();
  }

  function render() {
    boardEl.style.gridTemplateColumns = 'repeat(' + cols + ', 30px)';
    boardEl.innerHTML = '';
    for (var i = 0; i < cells.length; i++) {
      var b = document.createElement('button');
      b.className = 'cell';
      b.setAttribute('data-i', i);
      var c = cells[i];
      if (c.open) {
        b.classList.add('open');
        if (c.mine) b.classList.add('mine');
        else if (c.adj) {
          b.textContent = c.adj;
          var colors = ['', '#3a7bd5', '#2e8b57', '#d9534f', '#6f42c1', '#c49b1d', '#2aa9a0', '#7a4a8f', '#8a6d3b'];
          b.style.color = colors[c.adj] || '#555';
        }
      } else if (c.flag) {
        b.classList.add('flag');
        b.textContent = '🚩';
      }
      b.addEventListener('click', function (e) { reveal(Number(this.getAttribute('data-i')), true); });
      b.addEventListener('contextmenu', function (e) { e.preventDefault(); toggleFlag(Number(this.getAttribute('data-i'))); });
      boardEl.appendChild(b);
    }
  }

  function plantMines(safe) {
    var positions = [];
    for (var i = 0; i < cells.length; i++) if (i !== safe) positions.push(i);
    for (var k = positions.length - 1; k > 0; k--) {
      var j = Math.floor(Math.random() * (k + 1));
      var t = positions[k]; positions[k] = positions[j]; positions[j] = t;
    }
    for (var m = 0; m < mineCount; m++) cells[positions[m]].mine = true;
    for (var i = 0; i < cells.length; i++) {
      if (cells[i].mine) continue;
      var r = Math.floor(i / cols), col = i % cols, n = 0;
      for (var dr = -1; dr <= 1; dr++) for (var dc = -1; dc <= 1; dc++) {
        var rr = r + dr, cc = col + dc;
        if (rr >= 0 && rr < rows && cc >= 0 && cc < cols && cells[rr * cols + cc].mine) n++;
      }
      cells[i].adj = n;
    }
  }

  function startTimer() {
    timerId = setInterval(function () { seconds++; timerEl.textContent = seconds; }, 1000);
  }

  function reveal(i, byClick) {
    if (over || cells[i].flag) return;
    if (!started) {
      started = true;
      plantMines(i);
      startTimer();
    }
    var c = cells[i];
    if (c.open) {
      if (byClick && c.adj > 0) chord(i);
      return;
    }
    if (c.mine) {
      c.open = true;
      over = true;
      clearInterval(timerId);
      statusEl.textContent = '💥 踩雷了，重新开始吧';
      cells.forEach(function (x, idx) { if (x.mine) { x.open = true; } });
      render();
      return;
    }
    c.open = true;
    revealed++;
    if (c.adj === 0) flood(i);
    if (revealed === cells.length - mineCount) {
      over = true;
      clearInterval(timerId);
      statusEl.textContent = '🎉 赢了！用时 ' + seconds + ' 秒';
    }
    render();
  }

  function flood(i) {
    var r = Math.floor(i / cols), col = i % cols;
    for (var dr = -1; dr <= 1; dr++) for (var dc = -1; dc <= 1; dc++) {
      var rr = r + dr, cc = col + dc;
      if (rr < 0 || rr >= rows || cc < 0 || cc >= cols) continue;
      var idx = rr * cols + cc;
      if (!cells[idx].open && !cells[idx].flag && !cells[idx].mine) {
        cells[idx].open = true;
        revealed++;
        if (cells[idx].adj === 0) flood(idx);
      }
    }
  }

  function toggleFlag(i) {
    if (over || cells[i].open) return;
    cells[i].flag = !cells[i].flag;
    flags += cells[i].flag ? 1 : -1;
    minesEl.textContent = Math.max(0, mineCount - flags);
    render();
  }

  function chord(i) {
    var r = Math.floor(i / cols), col = i % cols, count = 0;
    for (var dr = -1; dr <= 1; dr++) for (var dc = -1; dc <= 1; dc++) {
      var rr = r + dr, cc = col + dc;
      if (rr >= 0 && rr < rows && cc >= 0 && cc < cols && cells[rr * cols + cc].flag) count++;
    }
    if (count === cells[i].adj) {
      for (dr = -1; dr <= 1; dr++) for (dc = -1; dc <= 1; dc++) {
        rr = r + dr; cc = col + dc;
        if (rr >= 0 && rr < rows && cc >= 0 && cc < cols && !cells[rr * cols + cc].open && !cells[rr * cols + cc].flag) reveal(rr * cols + cc, false);
      }
    }
  }

  restartEl.addEventListener('click', newGame);
  levelEl.addEventListener('change', newGame);
  newGame();
})();
</script>
