<script>
(function () {
  'use strict';

  var opEl = document.getElementById('op');
  var nEl = document.getElementById('n');
  var mEl = document.getElementById('m');
  var mlabel = document.getElementById('mlabel');
  var outEl = document.getElementById('out');
  var errEl = document.getElementById('err');

  function readN() { return parseInt(nEl.value, 10); }
  function readM() { return parseInt(mEl.value, 10); }

  function C(n, m) {
    m = Math.min(m, n - m);
    var res = 1n;
    for (var i = 0n; i < BigInt(m); i++) {
      res = res * (BigInt(n) - i) / (i + 1n);
    }
    return res;
  }
  function P(n, m) {
    var res = 1n;
    for (var i = 0; i < m; i++) res *= BigInt(n - i);
    return res;
  }
  function fact(n) {
    var res = 1n;
    for (var i = 2n; i <= BigInt(n); i++) res *= i;
    return res;
  }
  function group(s) {
    return s.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  }

  function show(label, value) {
    outEl.innerHTML = '<div class="head">' + label + '</div><div class="value">' + group(value) + '</div>' +
      '<div class="head" style="margin-top:8px">十进制位数：' + value.length + '</div>';
  }

  function calc() {
    errEl.textContent = '';
    outEl.innerHTML = '';
    var n = readN(), m = readM();
    if (!isFinite(n) || n < 0 || n > 5000) { errEl.textContent = 'n 需要在 0～5000 之间。'; return; }
    var kind = opEl.value;
    if (kind !== '!') {
      if (!isFinite(m) || m < 0 || m > n) { errEl.textContent = 'm 需要在 0～n 之间。'; return; }
      if (kind === 'C') show('C(' + n + ', ' + m + ') =', C(n, m).toString());
      else show('P(' + n + ', ' + m + ') =', P(n, m).toString());
    } else {
      show(n + '! =', fact(n).toString());
    }
  }

  opEl.addEventListener('change', function () {
    mlabel.style.display = opEl.value === '!' ? 'none' : '';
    calc();
  });
  document.getElementById('calc').addEventListener('click', calc);
  document.querySelectorAll('.examples button').forEach(function (b) {
    b.addEventListener('click', function () {
      nEl.value = b.getAttribute('data-n');
      mEl.value = b.getAttribute('data-m');
      var isFact = b.textContent.indexOf('!') >= 0;
      opEl.value = isFact ? '!' : (b.textContent.indexOf('P(') >= 0 ? 'P' : 'C');
      mlabel.style.display = opEl.value === '!' ? 'none' : '';
      calc();
    });
  });

  calc();
})();
</script>
