<script>
(function () {
  'use strict';

  var opEl = document.getElementById('op');
  var d1El = document.getElementById('d1'), d2El = document.getElementById('d2'), d3El = document.getElementById('d3');
  var d1l = document.getElementById('d1l'), d2l = document.getElementById('d2l'), d3l = document.getElementById('d3l');
  var matsEl = document.getElementById('mats'), outEl = document.getElementById('out'), errEl = document.getElementById('err');

  /* ---- 分数（BigInt） ---- */
  function gcd(a, b) { a = a < 0n ? -a : a; b = b < 0n ? -b : b; while (b) { var t = a % b; a = b; b = t; } return a; }
  function fr(n, d) {
    if (d === 0n) throw new Error('除以 0');
    if (d < 0n) { n = -n; d = -d; }
    var g = gcd(n, d);
    return { n: n / g, d: d / g };
  }
  function fadd(a, b) { return fr(a.n * b.d + b.n * a.d, a.d * b.d); }
  function fsub(a, b) { return fr(a.n * b.d - b.n * a.d, a.d * b.d); }
  function fmul(a, b) { return fr(a.n * b.n, a.d * b.d); }
  function fdiv(a, b) { return fr(a.n * b.d, a.d * b.n); }
  function fzero(a) { return a.n === 0n; }
  function fstr(a) { return a.d === 1n ? String(a.n) : a.n + '/' + a.d; }

  function parseFrac(s) {
    var t = s.trim();
    if (!t) return fr(0n, 1n);
    var neg = false;
    if (t[0] === '-') { neg = true; t = t.slice(1); }
    else if (t[0] === '+') { t = t.slice(1); }
    var n, d = 1n;
    if (t.indexOf('/') >= 0) {
      var p = t.split('/');
      n = BigInt(p[0] || '0'); d = BigInt(p[1] || '1');
    } else if (t.indexOf('.') >= 0) {
      var q = t.split('.');
      var dec = q[1] || '';
      var scale = 10n ** BigInt(dec.length);
      n = BigInt((q[0] || '0') + (dec || '0'));
      d = scale;
      if (neg) n = -n;
      return fr(n, d);
    } else {
      n = BigInt(t || '0');
    }
    if (neg) n = -n;
    return fr(n, d);
  }

  function opName() { return opEl.value; }
  function dims() {
    var a = { rows: clamp(d1El.value), cols: clamp(d2El.value) };
    var kind = opName();
    if (kind === 'det' || kind === 'inv') {
      if (a.rows !== a.cols) throw new Error('行列式 / 逆矩阵要求方阵（行数 = 列数）。');
    }
    if (kind === 'add') {
      // A 与 B 同型，B 行/列同 A
    }
    return a;
  }
  function clamp(v) { v = parseInt(v, 10); if (!isFinite(v) || v < 1) v = 1; if (v > 6) v = 6; return v; }

  function updateLabels() {
    var kind = opName();
    if (kind === 'mul') {
      d1l.childNodes[0].textContent = 'A 行数 ';
      d2l.childNodes[0].textContent = 'A 列数 (= B 行数) ';
      d2l.style.display = '';
      d3l.style.display = '';
    } else if (kind === 'add') {
      d1l.childNodes[0].textContent = '行数 ';
      d2l.childNodes[0].textContent = '列数 ';
      d2l.style.display = '';
      d3l.style.display = 'none';
    } else if (kind === 'det' || kind === 'inv') {
      d1l.childNodes[0].textContent = '阶数 n ';
      d2l.style.display = 'none';
      d3l.style.display = 'none';
    } else {
      d1l.childNodes[0].textContent = '行数 ';
      d2l.childNodes[0].textContent = '列数 ';
      d2l.style.display = '';
      d3l.style.display = 'none';
    }
  }

  function matrixInputs() {
    var kind = opName();
    var a = { rows: clamp(d1El.value), cols: (kind === 'det' || kind === 'inv') ? clamp(d1El.value) : clamp(d2El.value) };
    matsEl.innerHTML = '';
    var defs = [];
    if (kind === 'add') {
      defs.push({ name: 'A', rows: a.rows, cols: a.cols });
      defs.push({ name: 'B', rows: a.rows, cols: a.cols });
    } else if (kind === 'mul') {
      defs.push({ name: 'A', rows: a.rows, cols: a.cols });
      defs.push({ name: 'B', rows: a.cols, cols: clamp(d3El.value) });
    } else {
      defs.push({ name: 'A', rows: a.rows, cols: a.cols });
    }
    defs.forEach(function (def) {
      var div = document.createElement('div');
      div.className = 'mat';
      var title = document.createElement('p');
      title.className = 'mat-title';
      title.textContent = def.name + '（' + def.rows + '×' + def.cols + '）';
      div.appendChild(title);
      div.style.gridTemplateColumns = 'repeat(' + def.cols + ', 70px)';
      for (var r = 0; r < def.rows; r++) for (var c = 0; c < def.cols; c++) {
        var input = document.createElement('input');
        input.setAttribute('data-mat', def.name);
        input.setAttribute('data-r', r);
        input.setAttribute('data-c', c);
        input.value = '0';
        div.appendChild(input);
      }
      matsEl.appendChild(div);
    });
  }

  function fillSample() {
    matsEl.querySelectorAll('input').forEach(function (input) {
      input.value = String(Math.floor(Math.random() * 7) - 3);
    });
  }

  function readMatrix(name, rows, cols) {
    var m = [];
    for (var r = 0; r < rows; r++) {
      var row = [];
      for (var c = 0; c < cols; c++) {
        var input = matsEl.querySelector('input[data-mat="' + name + '"][data-r="' + r + '"][data-c="' + c + '"]');
        if (!input) throw new Error('找不到矩阵元素 ' + name);
        row.push(parseFrac(input.value));
      }
      m.push(row);
    }
    return m;
  }

  function matrices() {
    var kind = opName();
    var rows = clamp(d1El.value), cols = (kind === 'det' || kind === 'inv') ? rows : clamp(d2El.value);
    if (kind === 'add') return { A: readMatrix('A', rows, cols), B: readMatrix('B', rows, cols) };
    if (kind === 'mul') return { A: readMatrix('A', rows, cols), B: readMatrix('B', cols, clamp(d3El.value)) };
    return { A: readMatrix('A', rows, cols) };
  }

  function clone(M) { return M.map(function (row) { return row.slice(); }); }

  function gaussInv(A) {
    var n = A.length;
    var M = [];
    for (var r = 0; r < n; r++) {
      M.push(A[r].slice());
      for (var c = 0; c < n; c++) M[r].push(c === r ? fr(1n, 1n) : fr(0n, 1n));
    }
    for (var col = 0; col < n; col++) {
      var piv = -1;
      for (var i = col; i < n; i++) if (!fzero(M[i][col])) { piv = i; break; }
      if (piv < 0) throw new Error('矩阵不可逆（列 ' + (col + 1) + ' 主元为 0）。');
      if (piv !== col) { var tmp = M[col]; M[col] = M[piv]; M[piv] = tmp; }
      var pv = M[col][col];
      for (var rr = 0; rr < n; rr++) {
        if (rr === col) continue;
        var factor = fdiv(M[rr][col], pv);
        for (var cc = 0; cc < 2 * n; cc++) M[rr][cc] = fsub(M[rr][cc], fmul(factor, M[col][cc]));
      }
    }
    var inv = [];
    for (rr = 0; rr < n; rr++) {
      var diag = M[rr][rr];
      inv.push([]);
      for (var cc2 = n; cc2 < 2 * n; cc2++) inv[rr].push(fdiv(M[rr][cc2], diag));
    }
    return inv;
  }

  function det(A) {
    var n = A.length, M = clone(A), sign = fr(1n, 1n), d = fr(1n, 1n);
    for (var col = 0; col < n; col++) {
      var piv = -1;
      for (var i = col; i < n; i++) if (!fzero(M[i][col])) { piv = i; break; }
      if (piv < 0) return fr(0n, 1n);
      if (piv !== col) { var tmp = M[col]; M[col] = M[piv]; M[piv] = tmp; sign = fr(-sign.n, sign.d); }
      for (var r = col + 1; r < n; r++) {
        if (fzero(M[r][col])) continue;
        var factor = fdiv(M[r][col], M[col][col]);
        for (var c = col; c < n; c++) M[r][c] = fsub(M[r][c], fmul(factor, M[col][c]));
      }
    }
    for (r = 0; r < n; r++) d = fmul(d, M[r][r]);
    return fmul(sign, d);
  }

  function htmlTable(M) {
    var s = '<table><tbody>';
    M.forEach(function (row) {
      s += '<tr>';
      row.forEach(function (v) { s += '<td>' + fstr(v) + '</td>'; });
      s += '</tr>';
    });
    return s + '</tbody></table>';
  }

  function calc() {
    errEl.textContent = '';
    outEl.innerHTML = '';
    try {
      var kind = opName();
      var rows = clamp(d1El.value), cols = (kind === 'det' || kind === 'inv') ? rows : clamp(d2El.value);
      var M = matrices();
      if (kind === 'mul') {
        var C = [];
        for (var r = 0; r < M.A.length; r++) {
          C.push([]);
          for (var c = 0; c < M.B[0].length; c++) {
            var sum = fr(0n, 1n);
            for (var k = 0; k < M.A[0].length; k++) sum = fadd(sum, fmul(M.A[r][k], M.B[k][c]));
            C[r].push(sum);
          }
        }
        outEl.innerHTML = '<p class="out-title">A × B</p>' + htmlTable(C);
      } else if (kind === 'add') {
        var S = [];
        for (r = 0; r < rows; r++) {
          S.push([]);
          for (c = 0; c < cols; c++) S[r].push(fadd(M.A[r][c], M.B[r][c]));
        }
        outEl.innerHTML = '<p class="out-title">A + B</p>' + htmlTable(S);
      } else if (kind === 'transpose') {
        var T = [];
        for (c = 0; c < cols; c++) {
          T.push([]);
          for (r = 0; r < rows; r++) T[c].push(M.A[r][c]);
        }
        outEl.innerHTML = '<p class="out-title">Aᵀ</p>' + htmlTable(T);
      } else if (kind === 'det') {
        outEl.innerHTML = '<p class="out-title">det(A) =</p><table><tbody><tr><td>' + fstr(det(M.A)) + '</td></tr></tbody></table>';
      } else if (kind === 'inv') {
        outEl.innerHTML = '<p class="out-title">A⁻¹</p>' + htmlTable(gaussInv(M.A));
      }
    } catch (e) {
      errEl.textContent = e.message;
    }
  }

  opEl.addEventListener('change', function () { updateLabels(); matrixInputs(); });
  document.getElementById('gen').addEventListener('click', matrixInputs);
  document.getElementById('sample').addEventListener('click', fillSample);
  document.getElementById('calc').addEventListener('click', calc);
  updateLabels();
  matrixInputs();
})();
</script>
