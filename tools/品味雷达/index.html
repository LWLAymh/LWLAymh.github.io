<script>
(function () {
  'use strict';

  var apiKeyEl = document.getElementById('api-key');
  var saveKeyEl = document.getElementById('save-key');
  var modelEl = document.getElementById('model');
  var baseEl = document.getElementById('base-url');
  var tempEl = document.getElementById('temperature');
  var statusEl = document.getElementById('status');
  var chatEl = document.getElementById('chat');
  var inputEl = document.getElementById('input');
  var sendEl = document.getElementById('send');
  var clearEl = document.getElementById('clear');

  var LS = { base: 'taste-radar-base', model: 'taste-radar-model', temp: 'taste-radar-temp', ctx: 'taste-radar-context' };
  var KEY_COOKIE = 'taste-radar-key';
  var LEGACY_KEY_COOKIE = 'ai-recommend-key';
  var taste = null;
  var busy = false;
  var messages = [];

  var VISITOR_SYSTEM_PROMPT = [
    '你是「品味雷达」助手，正在和一位普通访客对话。',
    '',
    '下面 <TASTE_ARCHIVE> 是一份「博主的品味档案」，由博主本地 agent 导出，代表博主的偏好，而不是访客的偏好。',
    '你的任务：把这份档案当作推荐过滤器，帮访客从小说、电影/剧集、游戏等作品中找到符合这套品味的候选。',
    '',
    '角色与语气规则：',
    '1. 不要把访客当成档案本人：不要说「你喜欢《长日将尽》」「你读过……」「你爱……」这类话。',
    '2. 把档案和访客分开表述，例如：「按这份档案的偏好」「档案主人会喜欢这种克制叙事」「这套品味会命中……」；如果访客说自己也有类似偏好，再说「如果你也喜欢……」。',
    '3. 不要以「和你读过的相近」作为推荐理由——访客并没有读过档案里的那些作品。',
    '4. 先结合访客当前的问题（类型、题材、心情、篇幅、语言、平台等）再推荐；访客没给约束时，按档案推荐结构给 3~5 个候选，并在结尾问一句访客自己的限制。',
    '',
    '推荐规则（对候选内容的约束）：',
    '- 严格依据档案里的 likes / dislikes / hard_no / recommendation_style / examples；',
    '- 命中雷点默认不推；同时命中喜欢和雷点时，默认不推，若推荐必须显式标出雷点并说明理由；',
    '- already_consumed 只是博主自己读过的记录，不是访客已读清单：不要把里面的作品排除，也不要说访客读过；可以推荐，并说明「档案主人已读过且喜欢」作为参照。',
    '- 每个候选说明匹配了哪个偏好（叙事手法、情感母题、氛围等），不说「口碑好/评分高/经典之作」这类套话；',
    '- 涉及自毁/暗色题材时，按档案的硬分界判断；',
    '- 每轮 3~5 个候选，标主推/拓展；不确定是否踩雷就直说；剧透先预警；游戏线索少时先问访客的类型/平台偏好。',
    '',
    '用中文回答，简洁自然，像了解这套品味的人在帮访客挑作品。'
  ].join('\n');

  function safeGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function safeSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function safeDel(k) { try { localStorage.removeItem(k); } catch (e) {} }

  /* ---- Cookie：只保存 API Key；作用域收窄到 /tools/，Secure 在 https 下自动开启，SameSite=Strict ---- */
  var KEY_COOKIE_PATH = '/tools/';
  function setCookie(name, value, days, path) {
    var secure = location.protocol === 'https:' ? '; Secure' : '';
    document.cookie = name + '=' + encodeURIComponent(value) +
      '; Path=' + (path || KEY_COOKIE_PATH) + '; Max-Age=' + (days * 86400) + '; SameSite=Strict' + secure;
  }
  function getCookie(name) {
    var prefix = name + '=';
    return document.cookie.split(';').map(function (s) { return s.trim(); })
      .filter(function (s) { return s.indexOf(prefix) === 0; })
      .map(function (s) { return decodeURIComponent(s.slice(prefix.length)); })[0] || null;
  }
  function delCookie(name, path) {
    setCookie(name, '', -1, path);
  }

  /* 旧版本曾把 Key 存在 Path=/ 的 ai-recommend-key 里：迁移到新 Cookie 后清除旧值。 */
  function migrateLegacyKey() {
    var legacy = getCookie(LEGACY_KEY_COOKIE);
    if (legacy && !getCookie(KEY_COOKIE)) setCookie(KEY_COOKIE, legacy, 30);
    if (legacy) {
      var secure = location.protocol === 'https:' ? '; Secure' : '';
      document.cookie = LEGACY_KEY_COOKIE + '=; Path=/; Max-Age=0; SameSite=Strict' + secure;
    }
  }

  function loadSettings() {
    migrateLegacyKey();
    var savedBase = safeGet(LS.base); if (savedBase) baseEl.value = savedBase;
    var savedModel = safeGet(LS.model); if (savedModel) modelEl.value = savedModel;
    var savedTemp = safeGet(LS.temp); if (savedTemp) tempEl.value = savedTemp;
    var savedKey = getCookie(KEY_COOKIE);
    if (savedKey) { apiKeyEl.value = savedKey; saveKeyEl.checked = true; }
    restoreContext();
  }

  function persistSettings() {
    safeSet(LS.base, baseEl.value.trim());
    safeSet(LS.model, modelEl.value.trim());
    safeSet(LS.temp, tempEl.value);
    if (saveKeyEl.checked && apiKeyEl.value.trim()) setCookie(KEY_COOKIE, apiKeyEl.value.trim(), 30);
    else delCookie(KEY_COOKIE);
  }

  function saveContext() {
    safeSet(LS.ctx, JSON.stringify(messages.slice(-40))); // 只保留最近 40 条，避免 localStorage 撑爆
  }
  function restoreContext() {
    var raw = safeGet(LS.ctx);
    if (!raw) return;
    try {
      var arr = JSON.parse(raw);
      if (Array.isArray(arr)) {
        arr.forEach(function (m) {
          if (m && (m.role === 'user' || m.role === 'assistant') && typeof m.content === 'string') {
            messages.push(m);
            addMessage(m.role, m.content);
          }
        });
        if (messages.length) addMessage('assistant', '—— 已恢复上次对话，继续输入即可。');
      }
    } catch (e) {}
  }

  [baseEl, modelEl, tempEl].forEach(function (el) {
    el.addEventListener('change', persistSettings);
  });
  apiKeyEl.addEventListener('change', persistSettings);
  saveKeyEl.addEventListener('change', function () {
    persistSettings();
    statusEl.textContent = saveKeyEl.checked
      ? 'API Key 已保存到本机 Cookie（30 天）。'
      : 'API Key 已从 Cookie 删除，只在本次会话内存中保留。';
  });

  var tasteDoc = null;
  fetch('./taste-export.json?v=3')
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function (doc) {
      tasteDoc = doc;
      // 档案是「博主的品味」，而使用者是访客：不要把访客当成档案本人。
      // 只把白名单字段放进系统提示词，避免档案里夹带其它指令字段。
      var ARCHIVE_FIELDS = ['schema', 'exported_at', 'privacy', 'identity', 'recommend_for',
        'likes', 'dislikes', 'already_consumed', 'recommendation_style', 'examples'];
      var archive = {};
      ARCHIVE_FIELDS.forEach(function (k) { if (doc[k] !== undefined) archive[k] = doc[k]; });
      taste = VISITOR_SYSTEM_PROMPT + '\n\n<TASTE_ARCHIVE>\n' + JSON.stringify(archive, null, 2) + '\n</TASTE_ARCHIVE>';
      var date = doc.exported_at ? '，导出日期 ' + doc.exported_at : '';
      statusEl.textContent = 'taste-export 已加载（' + taste.length + ' 字符' + date + '）。';
    })
    .catch(function (e) {
      taste = null;
      statusEl.textContent = 'taste-export.json 加载失败：' + e.message + '，请确认 tools/品味雷达/taste-export.json 存在且是合法 JSON。';
    });

  function systemPrompt() {
    if (taste) return taste;
    return '你是「品味雷达」助手。用户向你输入自己的 API 后与你交互，请根据下面的品味档案做个性化推荐。\n\n' +
      '<TASTE>\n（taste-export 未加载）\n</TASTE>';
  }

  function addMessage(role, text) {
    var div = document.createElement('div');
    div.className = 'msg ' + role;
    div.textContent = text;
    chatEl.appendChild(div);
    chatEl.scrollTop = chatEl.scrollHeight;
    return div;
  }

  function finishLoading(el, text, role) {
    if (role === 'error') {
      el.className = 'msg error';
    } else {
      el.className = 'msg assistant';
    }
    el.textContent = text;
    chatEl.scrollTop = chatEl.scrollHeight;
  }

  async function callAPI() {
    var key = apiKeyEl.value.trim();
    var model = modelEl.value.trim();
    var base = baseEl.value.trim().replace(/\/+$/, '');
    var temp = parseFloat(tempEl.value);
    if (!key) throw new Error('请先填写 API Key。');
    if (!model) throw new Error('请填写模型名称。');
    if (!base) throw new Error('请填写 Base URL。');
    var isLocalhost = /^https?:\/\/(localhost|127\.0\.0\.1)(:\d+)?(\/|$)/i.test(base);
    if (!/^https:\/\//i.test(base) && !isLocalhost) {
      throw new Error('Base URL 必须使用 HTTPS（localhost 除外），否则 API Key 可能以明文传输。');
    }
    if (!isFinite(temp)) throw new Error('温度参数无效。');

    var payloadMessages = [{ role: 'system', content: systemPrompt() }].concat(messages);
    var res = await fetch(base + '/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + key,
      },
      body: JSON.stringify({ model: model, messages: payloadMessages, temperature: temp }),
    });
    if (!res.ok) {
      var errText = await res.text();
      throw new Error('API 返回 ' + res.status + '：' + errText.slice(0, 300));
    }
    var data = await res.json();
    var content = (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content) || '';
    if (!content) throw new Error('API 返回里没有内容，请检查模型名称与 Base URL。');
    return content;
  }

  sendEl.addEventListener('click', function () {
    if (busy) return;
    var q = inputEl.value.trim();
    if (!q) return;
    addMessage('user', q);
    inputEl.value = '';
    messages.push({ role: 'user', content: q });
    saveContext();
    var loading = addMessage('assistant', '思考中…');
    busy = true;
    sendEl.disabled = true;
    callAPI()
      .then(function (text) {
        messages.push({ role: 'assistant', content: text });
        saveContext();
        finishLoading(loading, text, 'assistant');
      })
      .catch(function (e) {
        finishLoading(loading, '请求失败：' + e.message + '\n\n提示：如果报 CORS / 网络错误，说明该 API 不允许浏览器直接调用；请换一个允许浏览器 CORS 的 Base URL。', 'error');
      })
      .finally(function () {
        busy = false;
        sendEl.disabled = false;
        chatEl.scrollTop = chatEl.scrollHeight;
      });
  });

  inputEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendEl.click(); }
  });

  clearEl.addEventListener('click', function () {
    messages = [];
    chatEl.innerHTML = '';
    safeDel(LS.ctx);
  });

  loadSettings();
})();
</script>
</body>
</html>
