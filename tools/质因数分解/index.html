<script>
(function () {
  'use strict';

  var form = document.getElementById('form');
  var input = document.getElementById('num');
  var result = document.getElementById('result');
  var error = document.getElementById('error');

  document.querySelectorAll('.examples button').forEach(function (btn) {
    btn.addEventListener('click', function () {
      input.value = btn.getAttribute('data-n');
      run();
    });
  });

  function setError(msg) {
    error.textContent = msg;
    result.textContent = '';
    result.classList.add('empty');
  }

  function modPow(a, b, m) {
    var r = 1n;
    a %= m;
    while (b > 0n) {
      if (b & 1n) r = (r * a) % m;
      a = (a * a) % m;
      b >>= 1n;
    }
    return r;
  }

  var MR_BASES = [2n, 325n, 9375n, 28178n, 450775n, 9780504n, 1795265022n];
  function isPrime(n) {
    if (n < 2n) return false;
    var small = [2n, 3n, 5n, 7n, 11n, 13n, 17n, 19n, 23n, 29n, 31n, 37n];
    for (var i = 0; i < small.length; i++) {
      if (n === small[i]) return true;
      if (n % small[i] === 0n) return false;
    }
    var d = n - 1n, r = 0n;
    while ((d & 1n) === 0n) { d >>= 1n; r++; }
    for (var j = 0; j < MR_BASES.length; j++) {
      var a = MR_BASES[j] % n;
      if (a === 0n) continue;
      var x = modPow(a, d, n);
      if (x === 1n || x === n - 1n) continue;
      var ok = false;
      for (var k = 0n; k < r - 1n; k++) {
        x = (x * x) % n;
        if (x === n - 1n) { ok = true; break; }
      }
      if (!ok) return false;
    }
    return true;
  }

  function gcd(a, b) {
    while (b) { var t = a % b; a = b; b = t; }
    return a;
  }

  function pollardRho(n) {
    if ((n & 1n) === 0n) return 2n;
    var c = 1n;
    while (true) {
      var x = 2n, y = 2n, d = 1n;
      while (d === 1n) {
        x = (x * x + c) % n;
        y = (y * y + c) % n;
        y = (y * y + c) % n;
        var diff = x > y ? x - y : y - x;
        d = gcd(diff, n);
      }
      if (d < n) return d;
      c += 1n;
      if (c > 30n) throw new Error('Pollard rho 分解失败');
    }
  }

  function addFactor(map, p) {
    map.set(p, (map.get(p) || 0n) + 1n);
  }

  function factor(n, map) {
    if (n === 1n) return;
    if (isPrime(n)) { addFactor(map, n); return; }
    var d = pollardRho(n);
    factor(d, map);
    factor(n / d, map);
  }

  function format(map) {
    var parts = [];
    map.forEach(function (e, p) {
      parts.push(e === 1n ? String(p) : String(p) + '<sup>' + e + '</sup>');
    });
    return parts.join('<span class="times"> × </span>');
  }

  function run() {
    error.textContent = '';
    var s = input.value.trim();
    if (!/^\d+$/.test(s)) { setError('请输入正整数（只允许数字）。'); return; }
    if (s.length > 24) { setError('数字太大（最多 24 位），换个小一点的试试。'); return; }
    var n = BigInt(s);
    if (n === 0n) { setError('0 没有质因数分解，请输入正整数。'); return; }
    if (n === 1n) {
      result.classList.remove('empty');
      result.innerHTML = '1 既不是质数也不是合数。';
      return;
    }
    try {
      var map = new Map();
      factor(n, map);
      var sorted = Array.from(map.entries()).sort(function (a, b) { return a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0; });
      result.classList.remove('empty');
      result.innerHTML = '<b>' + n + '</b> = ' + format(new Map(sorted));
    } catch (e) {
      setError('分解失败：' + e.message);
    }
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    run();
  });
})();
</script>
