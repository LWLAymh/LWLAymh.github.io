<script>

(function () {
  'use strict';

  var form = document.getElementById('prime-form');
  var input = document.getElementById('prime-num');
  var result = document.getElementById('prime-result');
  var error = document.getElementById('prime-error');

  document.querySelectorAll('.prime-examples button').forEach(function (btn) {
    btn.addEventListener('click', function () {
      input.value = btn.getAttribute('data-n');
      run();
    });
  });

  function setError(msg) {
    error.textContent = msg;
    result.textContent = '';
    result.classList.add('empty');
  }

  function modPow(a, b, m) {
    var r = 1n;
    a %= m;
    while (b > 0n) {
      if (b & 1n) r = (r * a) % m;
      a = (a * a) % m;
      b >>= 1n;
    }
    return r;
  }

  var MR_BASES = [2n, 325n, 9375n, 28178n, 450775n, 9780504n, 1795265022n];
  function isPrime(n) {
    if (n < 2n) return false;
    var small = [2n, 3n, 5n, 7n, 11n, 13n, 17n, 19n, 23n, 29n, 31n, 37n];
    for (var i = 0; i < small.length; i++) {
      if (n === small[i]) return true;
      if (n % small[i] === 0n) return false;
    }
    var d = n - 1n, r = 0n;
    while ((d & 1n) === 0n) { d >>= 1n; r++; }
    for (var j = 0; j < MR_BASES.length; j++) {
      var a = MR_BASES[j] % n;
      if (a === 0n) continue;
      var x = modPow(a, d, n);
      if (x === 1n || x === n - 1n) continue;
      var ok = false;
      for (var k = 0n; k < r - 1n; k++) {
        x = (x * x) % n;
        if (x === n - 1n) { ok = true; break; }
      }
      if (!ok) return false;
    }
    return true;
  }

  function gcd(a, b) {
    while (b) { var t = a % b; a = b; b = t; }
    return a;
  }

  function pollardRho(n) {
    if ((n & 1n) === 0n) return 2n;
    var c = 1n;
    while (true) {
      var x = 2n, y = 2n, d = 1n;
      while (d === 1n) {
        x = (x * x + c) % n;
        y = (y * y + c) % n;
        y = (y * y + c) % n;
        var diff = x > y ? x - y : y - x;
        d = gcd(diff, n);
      }
      if (d < n) return d;
      c += 1n;
      if (c > 30n) throw new Error('Pollard rho 分解失败');
    }
  }

  function addFactor(map, p) {
    map.set(p, (map.get(p) || 0n) + 1n);
  }

  function factor(n, map) {
    if (n === 1n) return;
    if (isPrime(n)) { addFactor(map, n); return; }
    var d = pollardRho(n);
    factor(d, map);
    factor(n / d, map);
  }

  function format(map) {
    var parts = [];
    map.forEach(function (e, p) {
      parts.push(e === 1n ? String(p) : String(p) + '<sup>' + e + '</sup>');
    });
    return parts.join('<span class="times"> × </span>');
  }

  function run() {
    error.textContent = '';
    var s = input.value.trim();
    if (!/^\d+$/.test(s)) { setError('请输入正整数（只允许数字）。'); return; }
    if (s.length > 24) { setError('数字太大（最多 24 位），换个小一点的试试。'); return; }
    var n = BigInt(s);
    if (n === 0n) { setError('0 没有质因数分解，请输入正整数。'); return; }
    if (n === 1n) {
      result.classList.remove('empty');
      result.innerHTML = '1 既不是质数也不是合数。';
      return;
    }
    try {
      var map = new Map();
      factor(n, map);
      var sorted = Array.from(map.entries()).sort(function (a, b) { return a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0; });
      result.classList.remove('empty');
      result.innerHTML = '<b>' + n + '</b> = ' + format(new Map(sorted));
    } catch (e) {
      setError('分解失败：' + e.message);
    }
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    run();
  });
})();

</script>
<script>

(function () {
  'use strict';

  var opEl = document.getElementById('m-op');
  var d1El = document.getElementById('m-d1'), d2El = document.getElementById('m-d2'), d3El = document.getElementById('m-d3');
  var d1l = document.getElementById('m-d1l'), d2l = document.getElementById('m-d2l'), d3l = document.getElementById('m-d3l');
  var matsEl = document.getElementById('m-mats'), outEl = document.getElementById('m-out'), errEl = document.getElementById('m-err');
  var SQUARE = ['det', 'inv', 'charpoly', 'eigen', 'jordan'];

  /* ---------- 分数 ---------- */
  function gcd(a, b) { a = a < 0n ? -a : a; b = b < 0n ? -b : b; while (b) { var t = a % b; a = b; b = t; } return a; }
  function fr(n, d) {
    if (d === 0n) throw new Error('除以 0');
    if (d < 0n) { n = -n; d = -d; }
    var g = gcd(n, d);
    return { n: n / g, d: d / g };
  }
  function fadd(a, b) { return fr(a.n * b.d + b.n * a.d, a.d * b.d); }
  function fsub(a, b) { return fr(a.n * b.d - b.n * a.d, a.d * b.d); }
  function fmul(a, b) { return fr(a.n * b.n, a.d * b.d); }
  function fdiv(a, b) { return fr(a.n * b.d, a.d * b.n); }
  function fzero(a) { return a.n === 0n; }
  function fneg(a) { return fr(-a.n, a.d); }
  function fstr(a) { return a.d === 1n ? String(a.n) : a.n + '/' + a.d; }

  function parseFrac(s) {
    var t = s.trim();
    if (!t) return fr(0n, 1n);
    var neg = false;
    if (t[0] === '-') { neg = true; t = t.slice(1); }
    else if (t[0] === '+') { t = t.slice(1); }
    var n, d = 1n;
    if (t.indexOf('/') >= 0) {
      var p = t.split('/');
      n = BigInt(p[0] || '0'); d = BigInt(p[1] || '1');
    } else if (t.indexOf('.') >= 0) {
      var q = t.split('.');
      var dec = q[1] || '';
      var scale = 10n ** BigInt(dec.length);
      n = BigInt((q[0] || '0') + (dec || '0'));
      d = scale;
      if (neg) n = -n;
      return fr(n, d);
    } else {
      n = BigInt(t || '0');
    }
    if (neg) n = -n;
    return fr(n, d);
  }

  /* ---------- 矩阵 ---------- */
  function identity(n) {
    var M = [];
    for (var r = 0; r < n; r++) { M.push([]); for (var c = 0; c < n; c++) M[r].push(c === r ? fr(1n, 1n) : fr(0n, 1n)); }
    return M;
  }
  function matMul(A, B) {
    var C = [];
    for (var r = 0; r < A.length; r++) {
      C.push([]);
      for (var c = 0; c < B[0].length; c++) {
        var sum = fr(0n, 1n);
        for (var k = 0; k < A[0].length; k++) sum = fadd(sum, fmul(A[r][k], B[k][c]));
        C[r].push(sum);
      }
    }
    return C;
  }
  function matSub(A, B) {
    return A.map(function (row, r) { return row.map(function (v, c) { return fsub(v, B[r][c]); }); });
  }
  function matScale(A, s) {
    return A.map(function (row) { return row.map(function (v) { return fmul(v, s); }); });
  }
  function trace(A) {
    var s = fr(0n, 1n);
    for (var i = 0; i < A.length; i++) s = fadd(s, A[i][i]);
    return s;
  }
  function clone(M) { return M.map(function (row) { return row.slice(); }); }

  function rref(M) {
    var R = clone(M), rows = R.length, cols = R[0].length, row = 0;
    for (var col = 0; col < cols && row < rows; col++) {
      var piv = -1;
      for (var i = row; i < rows; i++) if (!fzero(R[i][col])) { piv = i; break; }
      if (piv < 0) continue;
      if (piv !== row) { var t = R[row]; R[row] = R[piv]; R[piv] = t; }
      for (var r = 0; r < rows; r++) {
        if (r === row || fzero(R[r][col])) continue;
        var factor = fdiv(R[r][col], R[row][col]);
        for (var c = 0; c < cols; c++) R[r][c] = fsub(R[r][c], fmul(factor, R[row][c]));
      }
      row++;
    }
    return R;
  }
  function rank(M) {
    var R = rref(M), n = 0;
    for (var i = 0; i < R.length; i++) if (R[i].some(function (v) { return !fzero(v); })) n++;
    return n;
  }
  function nullity(M) { return M.length - rank(M); }

  function nullspaceBasis(A) {
    var n = A.length, R = rref(A);
    var pivots = [], pivotCols = new Set();
    var row = 0;
    for (var col = 0; col < n; col++) {
      if (row < n && !fzero(R[row][col])) {
        pivots.push([row, col]);
        pivotCols.add(col);
        row++;
      }
    }
    var basis = [];
    for (var free = 0; free < n; free++) {
      if (pivotCols.has(free)) continue;
      var v = new Array(n).fill(fr(0n, 1n));
      v[free] = fr(1n, 1n);
      for (var p = 0; p < pivots.length; p++) {
        var rr = pivots[p][0], pc = pivots[p][1];
        v[pc] = fneg(fdiv(R[rr][free], R[rr][pc]));
      }
      basis.push(v);
    }
    return basis;
  }

  /* ---------- 多项式 ---------- */
  // Faddeev-LeVerrier：det(λI−A) 的系数（升幂：常数项在前）
  function charpoly(A) {
    var n = A.length;
    var B = identity(n), coeffs = [fr(1n, 1n)];
    for (var k = 1; k <= n; k++) {
      var ck = fneg(fdiv(trace(matMul(A, B)), fr(BigInt(k), 1n)));
      coeffs.push(ck);
      B = matAdd(matMul(A, B), matScale(identity(n), ck));
    }
    return coeffs.reverse(); // 转成升幂：常数项在前
  }

  function matAdd(A, B) {
    return A.map(function (row, r) { return row.map(function (v, c) { return fadd(v, B[r][c]); }); });
  }

  // 升幂多项式除以 (x - root)，返回商（升幂）和余数
  function divByRoot(coeffsAsc, root) {
    var desc = coeffsAsc.slice().reverse();
    var qd = [], acc = fr(0n, 1n);
    for (var i = 0; i < desc.length - 1; i++) {
      acc = fadd(fmul(acc, root), desc[i]);
      qd.push(acc);
    }
    var rem = fadd(fmul(acc, root), desc[desc.length - 1]);
    return { q: qd.reverse(), rem: rem };
  }

  function clearDenoms(coeffsAsc) {
    var L = 1n;
    coeffsAsc.forEach(function (v) { L = L / gcd(L, v.d) * v.d; });
    return coeffsAsc.map(function (v) { return fr(v.n * (L / v.d), 1n); });
  }
  function divisors(n) {
    n = n < 0n ? -n : n;
    var out = new Set();
    for (var i = 1n; i * i <= n; i++) {
      if (n % i === 0n) { out.add(i); out.add(n / i); }
    }
    return Array.from(out);
  }
  function evalPoly(coeffsAsc, x) {
    var res = fr(0n, 1n);
    for (var i = coeffsAsc.length - 1; i >= 0; i--) res = fadd(fmul(res, x), coeffsAsc[i]);
    return res;
  }
  function rationalRoots(coeffsAsc) {
    var C = clearDenoms(coeffsAsc);
    var roots = [], seen = new Set();
    var pDivs = divisors(C[0].n), qDivs = divisors(C[C.length - 1].n);
    for (var a = 0; a < pDivs.length; a++) for (var b = 0; b < qDivs.length; b++) {
      for (var sgn = -1; sgn <= 1; sgn += 2) {
        var x = fr(BigInt(sgn) * pDivs[a], qDivs[b]);
        var key = x.n + '/' + x.d;
        if (seen.has(key)) continue;
        seen.add(key);
        if (fzero(evalPoly(C, x))) roots.push(x);
      }
    }
    roots.sort(function (a, b) { return a.n * b.d < b.n * a.d ? -1 : 1; });
    return roots;
  }

  function polyStr(coeffsAsc) {
    var parts = [];
    for (var i = coeffsAsc.length - 1; i >= 0; i--) {
      var c = coeffsAsc[i], pow = i;
      if (fzero(c)) continue;
      var sign = c.n < 0n ? ' − ' : (parts.length ? ' + ' : '');
      var abs = fstr(c.n < 0n ? fneg(c) : c);
      if (pow === 0) parts.push(sign + abs);
      else {
        var coef = abs === '1' ? '' : abs;
        parts.push(sign + coef + 'λ' + (pow === 1 ? '' : '<sup>' + pow + '</sup>'));
      }
    }
    return parts.join('') || '0';
  }

  /* ---------- 特征 / Jordan ---------- */
  function eigenData(A) {
    var cp = charpoly(A);
    var roots = rationalRoots(cp);
    var entries = [];
    var remaining = cp.slice();
    for (var i = 0; i < roots.length; i++) {
      var r = roots[i];
      var cur = remaining, cnt = 0;
      while (cur.length > 1) {
        var d = divByRoot(cur, r);
        if (!fzero(d.rem)) break;
        cnt++;
        cur = d.q;
      }
      if (cnt) {
        entries.push({ root: r, mult: cnt });
        remaining = cur;
      }
    }
    return { cp, entries, splits: remaining.length === 1 };
  }

  function jordanForm(A) {
    var data = eigenData(A), n = A.length;
    var totalMult = data.entries.reduce(function (s, e) { return s + e.mult; }, 0);
    if (!data.splits || totalMult !== n) return null;
    var blocks = [];
    for (var e = 0; e < data.entries.length; e++) {
      var lam = data.entries[e].root, m = data.entries[e].mult;
      var N = matSub(A, matScale(identity(n), lam));
      var d = [0];
      var power = identity(n);
      for (var k = 1; k <= m + 1; k++) {
        power = matMul(power, N);
        d.push(nullity(power));
      }
      for (var size = 1; size <= m; size++) {
        var atLeast = d[size] - d[size - 1];
        var exact = atLeast - (d[size + 1] - d[size]);
        for (var b = 0; b < exact; b++) {
          var block = [];
          for (var r = 0; r < size; r++) {
            var row = [];
            for (var c = 0; c < size; c++) row.push(c === r ? lam : (c === r + 1 ? fr(1n, 1n) : fr(0n, 1n)));
            block.push(row);
          }
          blocks.push(block);
        }
      }
    }
    return blocks;
  }

  /* ---------- UI ---------- */
  function clamp(v) { v = parseInt(v, 10); if (!isFinite(v) || v < 1) v = 1; if (v > 6) v = 6; return v; }
  function isSquareOp() { return SQUARE.indexOf(opEl.value) >= 0; }

  function updateLabels() {
    var kind = opEl.value;
    if (kind === 'mul') {
      d1l.childNodes[0].textContent = 'A 行数 ';
      d2l.childNodes[0].textContent = 'A 列数 (= B 行数) ';
      d2l.style.display = '';
      d3l.style.display = '';
    } else if (isSquareOp()) {
      d1l.childNodes[0].textContent = '阶数 n ';
      d2l.style.display = 'none';
      d3l.style.display = 'none';
    } else {
      d1l.childNodes[0].textContent = '行数 ';
      d2l.childNodes[0].textContent = '列数 ';
      d2l.style.display = '';
      d3l.style.display = 'none';
    }
  }

  function matrixInputs() {
    var kind = opEl.value;
    var rows = clamp(d1El.value);
    var cols = isSquareOp() ? rows : clamp(d2El.value);
    matsEl.innerHTML = '';
    var defs = [];
    if (kind === 'add') { defs.push({ name: 'A', rows: rows, cols: cols }, { name: 'B', rows: rows, cols: cols }); }
    else if (kind === 'mul') { defs.push({ name: 'A', rows: rows, cols: cols }, { name: 'B', rows: cols, cols: clamp(d3El.value) }); }
    else { defs.push({ name: 'A', rows: rows, cols: cols }); }

    defs.forEach(function (def) {
      var box = document.createElement('div');
      box.className = 'mat-box';
      var title = document.createElement('p');
      title.className = 'mat-title';
      title.textContent = def.name + '（' + def.rows + '×' + def.cols + '）';
      box.appendChild(title);
      var grid = document.createElement('div');
      grid.className = 'mat';
      grid.style.gridTemplateColumns = 'repeat(' + def.cols + ', 68px)';
      for (var r = 0; r < def.rows; r++) for (var c = 0; c < def.cols; c++) {
        var input = document.createElement('input');
        input.setAttribute('data-mat', def.name);
        input.setAttribute('data-r', r);
        input.setAttribute('data-c', c);
        input.value = '0';
        grid.appendChild(input);
      }
      box.appendChild(grid);
      matsEl.appendChild(box);
    });
  }

  function fillSample() {
    matsEl.querySelectorAll('input').forEach(function (input) {
      input.value = String(Math.floor(Math.random() * 7) - 3);
    });
  }

  function readMatrix(name, rows, cols) {
    var m = [];
    for (var r = 0; r < rows; r++) {
      var row = [];
      for (var c = 0; c < cols; c++) {
        var input = matsEl.querySelector('input[data-mat="' + name + '"][data-r="' + r + '"][data-c="' + c + '"]');
        if (!input) throw new Error('找不到矩阵元素 ' + name);
        row.push(parseFrac(input.value));
      }
      m.push(row);
    }
    return m;
  }

  function matrices() {
    var kind = opEl.value;
    var rows = clamp(d1El.value), cols = isSquareOp() ? rows : clamp(d2El.value);
    if (kind === 'add') return { A: readMatrix('A', rows, cols), B: readMatrix('B', rows, cols) };
    if (kind === 'mul') return { A: readMatrix('A', rows, cols), B: readMatrix('B', cols, clamp(d3El.value)) };
    return { A: readMatrix('A', rows, cols) };
  }

  function htmlTable(M) {
    var s = '<table><tbody>';
    M.forEach(function (row) {
      s += '<tr>';
      row.forEach(function (v) { s += '<td>' + fstr(v) + '</td>'; });
      s += '</tr>';
    });
    return s + '</tbody></table>';
  }
  function columnMatrix(v) {
    return v.map(function (x) { return [x]; });
  }

  function calc() {
    errEl.textContent = '';
    outEl.innerHTML = '';
    try {
      var kind = opEl.value;
      var rows = clamp(d1El.value), cols = isSquareOp() ? rows : clamp(d2El.value);
      var M = matrices();
      if (kind === 'mul') {
        outEl.innerHTML = '<p class="out-title">A × B =</p>' + htmlTable(matMul(M.A, M.B));
      } else if (kind === 'add') {
        outEl.innerHTML = '<p class="out-title">A + B =</p>' + htmlTable(matAdd(M.A, M.B));
      } else if (kind === 'transpose') {
        var T = [];
        for (var c = 0; c < cols; c++) { T.push([]); for (var r = 0; r < rows; r++) T[c].push(M.A[r][c]); }
        outEl.innerHTML = '<p class="out-title">Aᵀ =</p>' + htmlTable(T);
      } else if (kind === 'det') {
        var cp = charpoly(M.A);
        var d = cp[0]; // 特征多项式常数项 = det(-A)，注意符号
        var sign = (rows % 2 === 0) ? 1 : -1;
        outEl.innerHTML = '<p class="out-title">det(A) =</p><div class="out-box">' + fstr(sign === 1 ? d : fneg(d)) + '</div>';
      } else if (kind === 'inv') {
        outEl.innerHTML = '<p class="out-title">A⁻¹ =</p>' + htmlTable(inverse(M.A));
      } else if (kind === 'charpoly') {
        outEl.innerHTML = '<p class="out-title">det(λI − A) =</p><div class="out-box">' + polyStr(charpoly(M.A)) + '</div>';
      } else if (kind === 'eigen') {
        var data = eigenData(M.A);
        var html = '<p class="out-title">特征多项式：</p><div class="out-box">' + polyStr(data.cp) + '</div>';
        if (!data.entries.length) html += '<p class="out-title">有理数范围内没有特征值（特征值可能是无理数/复数）。</p>';
        data.entries.forEach(function (e, i) {
          html += '<p class="out-title">λ = ' + fstr(e.root) + '（重数 ' + e.mult + '）</p>';
          var basis = nullspaceBasis(matSub(M.A, matScale(identity(rows), e.root)));
          basis.forEach(function (v, j) {
            html += '<p class="out-title">特征向量 v' + (j + 1) + ' =</p>' + htmlTable(columnMatrix(v));
          });
        });
        if (!data.splits) html += '<p class="out-title">特征多项式在有理数范围内不能完全分解，上面只列出有理特征值。</p>';
        outEl.innerHTML = html;
      } else if (kind === 'jordan') {
        var blocks = jordanForm(M.A);
        if (!blocks) {
          outEl.innerHTML = '<p class="m-err">特征多项式在有理数范围内不能完全分解，无法得到有理 Jordan 标准型。</p>';
        } else {
          outEl.innerHTML = '<p class="out-title">Jordan 标准型（对角块）</p>';
          blocks.forEach(function (block, i) {
            outEl.innerHTML += '<p class="out-title">J' + (i + 1) + '</p>' + htmlTable(block);
          });
        }
      }
    } catch (e) {
      errEl.textContent = e.message;
    }
  }

  /* 矩阵求逆（Gauss-Jordan） */
  function inverse(A) {
    var n = A.length, M = [];
    for (var r = 0; r < n; r++) {
      M.push(A[r].slice());
      for (var c = 0; c < n; c++) M[r].push(c === r ? fr(1n, 1n) : fr(0n, 1n));
    }
    for (var col = 0; col < n; col++) {
      var piv = -1;
      for (var i = col; i < n; i++) if (!fzero(M[i][col])) { piv = i; break; }
      if (piv < 0) throw new Error('矩阵不可逆。');
      if (piv !== col) { var tmp = M[col]; M[col] = M[piv]; M[piv] = tmp; }
      var pv = M[col][col];
      for (var rr = 0; rr < n; rr++) {
        if (rr === col) continue;
        var factor = fdiv(M[rr][col], pv);
        for (var cc = 0; cc < 2 * n; cc++) M[rr][cc] = fsub(M[rr][cc], fmul(factor, M[col][cc]));
      }
    }
    var inv = [];
    for (rr = 0; rr < n; rr++) {
      inv.push([]);
      var diag = M[rr][rr];
      for (var cc2 = n; cc2 < 2 * n; cc2++) inv[rr].push(fdiv(M[rr][cc2], diag));
    }
    return inv;
  }

  opEl.addEventListener('change', function () { updateLabels(); matrixInputs(); });
  document.getElementById('m-gen').addEventListener('click', matrixInputs);
  document.getElementById('m-sample').addEventListener('click', fillSample);
  document.getElementById('m-calc').addEventListener('click', calc);
  updateLabels();
  matrixInputs();
})();

</script>
<script>

(function () {
  'use strict';

  var opEl = document.getElementById('c-op');
  var nEl = document.getElementById('c-n');
  var mEl = document.getElementById('c-m');
  var mlabel = document.getElementById('c-mlabel');
  var outEl = document.getElementById('c-out');
  var errEl = document.getElementById('c-err');

  function readN() { return parseInt(nEl.value, 10); }
  function readM() { return parseInt(mEl.value, 10); }

  function C(n, m) {
    m = Math.min(m, n - m);
    var res = 1n;
    for (var i = 0n; i < BigInt(m); i++) res = res * (BigInt(n) - i) / (i + 1n);
    return res;
  }
  function P(n, m) {
    var res = 1n;
    for (var i = 0; i < m; i++) res *= BigInt(n - i);
    return res;
  }
  function fact(n) {
    var res = 1n;
    for (var i = 2n; i <= BigInt(n); i++) res *= i;
    return res;
  }
  function S2(n, m) {
    var row = [1n];
    for (var i = 1; i <= n; i++) {
      var next = [0n];
      for (var j = 1; j <= Math.min(i, m); j++) next[j] = (row[j] || 0n) * BigInt(j) + (row[j - 1] || 0n);
      row = next;
    }
    return row[m] || 0n;
  }
  function S1(n, m) {
    var row = [1n];
    for (var i = 1; i <= n; i++) {
      var next = [0n];
      for (var j = 1; j <= Math.min(i, m); j++) next[j] = (row[j - 1] || 0n) + (row[j] || 0n) * BigInt(i - 1);
      row = next;
    }
    return row[m] || 0n;
  }
  function Bell(n) {
    var row = [1n];
    for (var i = 1; i <= n; i++) {
      var next = [row[row.length - 1]];
      for (var j = 1; j <= i; j++) next[j] = next[j - 1] + (row[j - 1] || 0n);
      row = next;
    }
    return row[0];
  }
  function Catalan(n) {
    return C(2 * n, n) / BigInt(n + 1);
  }
  function group(s) {
    return s.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  }
  function show(label, value) {
    outEl.innerHTML = '<div class="head">' + label + '</div><div class="value">' + group(value) + '</div>' +
      '<div class="head" style="margin-top:8px">十进制位数：' + value.length + '</div>';
  }

  function needsM() { return ['C', 'P', 'S2', 'S1'].indexOf(opEl.value) >= 0; }

  function maxN() {
    var k = opEl.value;
    if (k === 'S1' || k === 'S2' || k === 'B') return 400;
    if (k === 'Cat') return 2500;
    return 5000;
  }

  function updateM() {
    mlabel.style.display = needsM() ? '' : 'none';
    nEl.max = maxN();
  }

  function calc() {
    errEl.textContent = '';
    outEl.innerHTML = '';
    var n = readN(), m = readM(), kind = opEl.value, limit = maxN();
    if (!isFinite(n) || n < 0 || n > limit) { errEl.textContent = 'n 需要在 0～' + limit + ' 之间。'; return; }
    if (needsM()) {
      if (!isFinite(m) || m < 0 || m > n) { errEl.textContent = 'm 需要在 0～n 之间。'; return; }
    }
    var val;
    if (kind === 'C') { val = C(n, m); show('C(' + n + ', ' + m + ') =', val.toString()); }
    else if (kind === 'P') { val = P(n, m); show('P(' + n + ', ' + m + ') =', val.toString()); }
    else if (kind === '!') { val = fact(n); show(n + '! =', val.toString()); }
    else if (kind === 'S2') { val = S2(n, m); show('S(' + n + ', ' + m + ') =', val.toString()); }
    else if (kind === 'S1') { val = S1(n, m); show('s(' + n + ', ' + m + ') =', val.toString()); }
    else if (kind === 'B') { val = Bell(n); show('B(' + n + ') =', val.toString()); }
    else if (kind === 'Cat') { val = Catalan(n); show('Cat(' + n + ') =', val.toString()); }
  }

  opEl.addEventListener('change', function () { updateM(); calc(); });
  document.getElementById('c-calc').addEventListener('click', calc);
  document.querySelectorAll('.comb-examples button').forEach(function (b) {
    b.addEventListener('click', function () {
      opEl.value = b.getAttribute('data-op');
      nEl.value = b.getAttribute('data-n');
      mEl.value = b.getAttribute('data-m');
      updateM();
      calc();
    });
  });

  updateM();
  calc();
})();

</script>
</body>
