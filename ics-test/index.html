<main class="site-main">
<section class="ics-shell" id="ics-app" data-catalog="/web-data/catalog.json">
  <header class="ics-hero">
    <p class="ics-eyebrow">PKU · Introduction to Computer Systems</p>
    <h1>ICS 随机测试</h1>
    <p>选择知识模块，从历年题中随机组卷。客观题自动判分，综合题在查看解析后自评。</p>
  </header>

  <div class="ics-panel" id="ics-setup">
    <div class="ics-panel-head">
      <div><h2>组一份测试</h2><p id="ics-bank-summary">正在读取题库…</p></div>
      <button class="ics-text-button" id="ics-select-toggle" type="button">取消全选</button>
    </div>
    <fieldset class="ics-module-fieldset">
      <legend>知识模块（可多选）</legend>
      <div class="ics-module-grid" id="ics-modules" aria-live="polite"></div>
    </fieldset>
    <div class="ics-options">
      <label class="ics-field">题目数量
        <select id="ics-count">
          <option value="5">5 题</option>
          <option value="10" selected>10 题</option>
          <option value="15">15 题</option>
          <option value="20">20 题</option>
        </select>
      </label>
      <label class="ics-field">试卷类型
        <select id="ics-exam-type"><option value="">全部类型</option></select>
      </label>
      <button class="ics-primary" id="ics-start" type="button" disabled>开始测试</button>
    </div>
    <p class="ics-error" id="ics-setup-error" role="alert" hidden></p>
  </div>

  <section class="ics-panel ics-quiz" id="ics-quiz" hidden aria-live="polite">
    <div class="ics-progress-row">
      <button class="ics-text-button" id="ics-abandon" type="button">← 重新组卷</button>
      <span id="ics-progress-text"></span>
      <span id="ics-score-text"></span>
    </div>
    <div class="ics-progress-track" aria-hidden="true"><span id="ics-progress-bar"></span></div>
    <article class="ics-question">
      <div class="ics-question-meta" id="ics-question-meta"></div>
      <h2 id="ics-question-title"></h2>
      <div class="post-content ics-question-content" id="ics-question-content"></div>
    </article>
    <form id="ics-answer-form">
      <label class="ics-answer-label" for="ics-answer">你的回答</label>
      <textarea id="ics-answer" rows="4" placeholder="写下答案或解题思路…" required></textarea>
      <div class="ics-answer-actions">
        <button class="ics-primary" id="ics-submit" type="submit">提交答案</button>
      </div>
    </form>
    <section class="ics-feedback" id="ics-feedback" hidden>
      <div id="ics-verdict"></div>
      <details open>
        <summary>参考答案 / 解析</summary>
        <div class="post-content ics-reference" id="ics-reference"></div>
      </details>
      <div class="ics-self-grade" id="ics-self-grade" hidden>
        <p>这道题需要你根据参考内容自评：</p>
        <div class="ics-grade-buttons">
          <button type="button" data-grade="0">需要复习</button>
          <button type="button" data-grade="0.5">部分正确</button>
          <button type="button" data-grade="1">回答正确</button>
        </div>
      </div>
      <button class="ics-primary" id="ics-next" type="button" hidden>下一题</button>
    </section>
  </section>

  <section class="ics-panel ics-result" id="ics-result" hidden>
    <p class="ics-eyebrow">TEST COMPLETE</p>
    <h2>本次测试完成</h2>
    <div class="ics-score-ring" id="ics-final-score"></div>
    <p id="ics-final-summary"></p>
    <div class="ics-result-actions">
      <button class="ics-primary" id="ics-retry" type="button">再来一组</button>
      <button class="ics-secondary" id="ics-review-toggle" type="button">查看答题记录</button>
    </div>
    <div class="ics-review-list" id="ics-review-list" hidden></div>
  </section>
</section>
